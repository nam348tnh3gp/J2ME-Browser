name: Build MiniBrowser (J2ME MIDlet)

on:
  push:
    branches: [ main ]
    paths:
      - 'MiniBrowser.java'
      - 'MiniBrowser.jad'
      - '.github/workflows/build-app.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'MiniBrowser.java'
      - 'MiniBrowser.jad'
  workflow_dispatch:      # bấm "Run workflow" thủ công

jobs:
  build-midlet:
    name: Build MIDlet (.jar + .jad)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ── JDK 8: bắt buộc vì cần -bootclasspath (JDK 9+ đã bỏ) ──
    - name: Setup JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    # ── Tải API MIDP 2.0 + CLDC 1.1 từ Maven Central (MicroEmu) ──
    - name: Download J2ME APIs
      run: |
        mkdir -p libs
        curl -fsSL -o libs/midpapi20.jar \
          https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar
        curl -fsSL -o libs/cldcapi11.jar \
          https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
        ls -la libs/

    # ── Biên dịch: source/target 1.3 để tương thích KVM cũ ──
    - name: Compile MiniBrowser.java
      run: |
        mkdir -p classes
        javac \
          -source 1.3 -target 1.3 \
          -bootclasspath "libs/midpapi20.jar:libs/cldcapi11.jar" \
          -d classes \
          MiniBrowser.java
        echo "── Classes sinh ra: ──"
        find classes -name '*.class' -exec ls -la {} \;

    # ── Đóng gói .jar với manifest đầy đủ ──
    - name: Package .jar
      run: |
        cat > manifest.mf <<'EOF'
        Manifest-Version: 1.0
        MIDlet-Name: MiniBrowser
        MIDlet-Version: 1.0
        MIDlet-Vendor: YourName
        MIDlet-1: MiniBrowser, , MiniBrowser
        MicroEdition-Configuration: CLDC-1.1
        MicroEdition-Profile: MIDP-2.0
        EOF
        jar cfm MiniBrowser.jar manifest.mf -C classes .
        echo "── Nội dung JAR: ──"
        unzip -l MiniBrowser.jar

    # ── Sinh .jad với kích thước .jar chính xác ──
    - name: Generate .jad
      run: |
        cat > MiniBrowser.jad <<EOF
        MIDlet-1: MiniBrowser, , MiniBrowser
        MIDlet-Jar-URL: MiniBrowser.jar
        MIDlet-Jar-Size: $(stat -c%s MiniBrowser.jar)
        MIDlet-Name: MiniBrowser
        MIDlet-Vendor: YourName
        MIDlet-Version: 1.0
        MicroEdition-Configuration: CLDC-1.1
        MicroEdition-Profile: MIDP-2.0
        MIDlet-Permissions: javax.microedition.io.Connector.socket
        MIDlet-Permissions-Opt: javax.microedition.rms.RecordStore.write,javax.microedition.rms.RecordStore.read
        EOF
        cat MiniBrowser.jad

    # ── Lưu artifact (30 ngày) ──
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MiniBrowser-J2ME
        path: |
          MiniBrowser.jar
          MiniBrowser.jad
        retention-days: 30

    # ── (Tuỳ chọn) Gắn .jar/.jad vào Release khi push tag ──
    - name: Attach to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          MiniBrowser.jar
          MiniBrowser.jad
        generate_release_notes: true
