name: Run Proxy

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Compile proxy
        working-directory: proxy
        run: |
          javac -cp "libs/jsoup.jar:libs/flying-saucer-core.jar" MiniProxy.java

      - name: Run proxy (0.0.0.0:9999)
        working-directory: proxy
        run: |
          java -cp ".:libs/jsoup.jar:libs/flying-saucer-core.jar" MiniProxy
